name: CD

# Build + push Docker images to GitHub Container Registry on main branch + tags.
# Images consumers (e.g., Docker Compose, Kubernetes) can pull:
#   ghcr.io/<owner>/mcm-backend:latest
#   ghcr.io/<owner>/mcm-frontend:latest
#   ghcr.io/<owner>/mcm-backend:v1.2.3   (when a tag is pushed)
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false  # don't cancel image pushes mid-flight

permissions:
  contents: read
  packages: write     # required to push to GHCR

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & push ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: backend
            context: .
            dockerfile: apps/backend/Dockerfile
            image_suffix: backend
          - app: frontend
            context: .
            dockerfile: apps/frontend/Dockerfile
            image_suffix: frontend
            build_args: |
              VITE_API_BASE_URL=http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - name: Set lowercase image name
        id: img
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=${{ env.REGISTRY }}/${OWNER}/mcm-${{ matrix.image_suffix }}" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
          platforms: linux/amd64

      - name: Image digest
        run: echo "Image digest=${{ steps.img.outputs.name }}@${{ steps.meta.outputs.digest }}"

  verify-images:
    name: Verify images are pullable
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase owner
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Pull and inspect both images
        run: |
          set -euo pipefail
          for app in backend frontend; do
            IMG="ghcr.io/${{ steps.owner.outputs.name }}/mcm-${app}:sha-${GITHUB_SHA::7}"
            echo "::group::Pulling ${IMG}"
            docker pull "${IMG}"
            echo "::endgroup::"
            echo "::group::Inspecting ${IMG}"
            docker inspect "${IMG}" --format '{{.Config.Cmd}} {{.Config.Entrypoint}} {{.Config.ExposedPorts}} {{.Size}}'
            echo "::endgroup::"
          done
          echo "Both images pulled and inspected successfully."
