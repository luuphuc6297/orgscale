name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel old runs on the same ref when a new commit is pushed (saves CI minutes).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: ESLint
        run: yarn lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Typecheck backend
        run: yarn workspace @mcm/backend exec tsc --noEmit -p tsconfig.json
      - name: Typecheck frontend
        run: yarn workspace @mcm/frontend exec tsc --noEmit -p tsconfig.json

  test-backend:
    name: Test (backend e2e)
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campaign_manager_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/campaign_manager_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/campaign_manager_test
      JWT_SECRET: ci-test-secret-do-not-use-in-prod-0123456789
      NODE_ENV: test
      RATE_LIMIT_AUTH_MAX: '10000'
      RATE_LIMIT_API_MAX: '10000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Migrate test DB
        run: yarn workspace @mcm/backend migrate
      - name: Run e2e tests
        run: yarn workspace @mcm/backend test
      - name: Upload coverage (if produced)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    needs: [lint, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install
        run: yarn install --frozen-lockfile
      - name: Build backend
        run: yarn workspace @mcm/backend build
      - name: Build frontend
        run: yarn workspace @mcm/frontend build
        env:
          VITE_API_BASE_URL: http://localhost:4000
      - name: Upload backend dist
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: apps/backend/dist/
          retention-days: 7
      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist/
          retention-days: 7

  ci-success:
    name: CI green
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test-backend, build]
    if: always()
    steps:
      - name: Verify all upstream jobs passed
        run: |
          if [[ "${{ needs.lint.result }}" != "success" \
             || "${{ needs.typecheck.result }}" != "success" \
             || "${{ needs.test-backend.result }}" != "success" \
             || "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more jobs failed."
            exit 1
          fi
          echo "All CI jobs green."
