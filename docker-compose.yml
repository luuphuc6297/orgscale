services:
  postgres:
    image: postgres:16-alpine
    container_name: mcm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campaign_manager
    ports:
      - "5432:5432"
    volumes:
      - mcm-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: mcm-backend
    depends_on:
      postgres:
        condition: service_healthy
    # Secrets: set via shell `export JWT_SECRET=...` or .env at repo root before `docker compose up`.
    # Compose auto-loads `.env` (in the same dir as docker-compose.yml) — do NOT commit it.
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/campaign_manager
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me-only-for-dev-min-16-chars}
      SEND_SUCCESS_RATE: "0.8"
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    command: sh -c "/app/node_modules/.bin/sequelize-cli db:migrate && (/app/node_modules/.bin/sequelize-cli db:seed:all || true) && node dist/src/main.js"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000
    container_name: mcm-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  mcm-pg-data:
